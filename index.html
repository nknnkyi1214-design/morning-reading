<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>책 읽어주는 아침</title>
<style>
  :root {
    --bg: #fbf8f2;
    --surface: #ffffff;
    --ink: #2a2420;
    --ink-muted: #6b6157;
    --ink-faint: #a89f92;
    --line: rgba(60, 45, 30, 0.09);
    --line-strong: rgba(60, 45, 30, 0.14);
    --accent: #b0742f;
    --accent-hover: #97621f;
    --accent-soft: #fbeed6;
    --accent-ink: #7a4e18;
    --attend: #2f7d6e;
    --attend-soft: #d6f0e9;
    --attend-ink: #1f5a4e;
    --activity: #b0742f;
    --activity-soft: #fbeed6;
    --activity-ink: #7a4e18;
    --radius: 16px;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo",
      "Malgun Gothic", "Noto Sans KR", sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100dvh;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  .backdrop {
    position: fixed;
    inset: 0;
    z-index: -1;
    overflow: hidden;
    background:
      radial-gradient(1100px 620px at 80% -8%, #fff3dc 0%, rgba(255, 243, 220, 0) 60%),
      radial-gradient(900px 520px at 8% 4%, #eaf3ee 0%, rgba(234, 243, 238, 0) 55%),
      linear-gradient(180deg, #fdfaf4 0%, var(--bg) 42%);
  }
  .backdrop svg { position: absolute; }
  .backdrop .sun { top: -70px; right: -40px; width: 320px; height: 320px; opacity: 0.7; }
  .backdrop .hills { bottom: 0; left: 0; width: 100%; height: auto; }
  .backdrop .readers {
    bottom: -6px;
    left: 50%;
    transform: translateX(-50%);
    width: min(1080px, 100%);
    height: auto;
    opacity: 0.96;
  }

  .wrap { max-width: 960px; margin: 0 auto; padding: 32px 20px 64px; }

  header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 8px;
  }

  .brand { display: flex; align-items: flex-start; gap: 13px; }
  .brand-mark {
    flex-shrink: 0;
    width: 44px;
    height: 44px;
    border-radius: 13px;
    background: var(--accent-soft);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: inset 0 0 0 1px rgba(176, 116, 47, 0.18);
  }
  .brand-mark svg { color: var(--accent); }

  .title-group h1 { font-size: 27px; font-weight: 600; letter-spacing: -0.02em; margin: 0 0 3px; }
  .title-group p { margin: 0; color: var(--ink-muted); font-size: 15px; }

  .header-right { display: flex; align-items: center; gap: 14px; }
  .today { font-size: 13px; color: var(--ink-faint); font-variant-numeric: tabular-nums; white-space: nowrap; padding-top: 6px; }

  .btn-history {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    background: var(--surface);
    color: var(--accent-ink);
    font-size: 14px;
    padding: 9px 14px 9px 12px;
    box-shadow: inset 0 0 0 1px var(--line-strong);
  }
  .btn-history:hover { background: var(--accent-soft); box-shadow: inset 0 0 0 1px rgba(176, 116, 47, 0.32); }
  .btn-history svg { color: var(--accent); }

  .legend {
    display: flex;
    gap: 10px 20px;
    flex-wrap: wrap;
    margin: 20px 0 28px;
    padding: 14px 18px;
    background: rgba(255, 255, 255, 0.72);
    backdrop-filter: blur(4px);
    border-radius: 12px;
    box-shadow: inset 0 0 0 1px var(--line);
    font-size: 14px;
    color: var(--ink-muted);
  }
  .legend div { display: flex; align-items: center; gap: 8px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .dot.attend { background: var(--attend); }
  .dot.activity { background: var(--activity); }

  .stepbar { display: flex; align-items: center; gap: 12px; margin: 20px 0 22px; }
  .btn-back {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--surface);
    color: var(--ink-muted);
    font-size: 14px;
    padding: 9px 14px 9px 11px;
    box-shadow: inset 0 0 0 1px var(--line-strong);
  }
  .btn-back:hover { background: #fff; color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink-faint); }
  .step-title { font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }
  .step-title .chip { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 8px; vertical-align: middle; }

  .grade-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; }
  .grade-card {
    position: relative;
    background: var(--g-soft, var(--surface));
    border-radius: var(--radius);
    box-shadow: 0 1px 3px rgba(60, 45, 30, 0.06), inset 0 0 0 1px var(--g-line, var(--line));
    padding: 20px 20px 18px;
    text-align: left;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    gap: 8px;
    overflow: hidden;
    transition: box-shadow 200ms ease, transform 120ms ease;
    font-family: inherit;
  }
  .grade-card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--g-ink, var(--accent)); }
  .grade-card:hover { box-shadow: 0 8px 22px rgba(60, 45, 30, 0.12), inset 0 0 0 1px var(--g-line, var(--line-strong)); transform: translateY(-3px); }
  .grade-card:active { transform: translateY(0); }
  .grade-card:focus-visible { outline: 2px solid var(--g-ink, var(--accent)); outline-offset: 2px; }

  .grade-num { font-size: 23px; font-weight: 600; letter-spacing: -0.02em; color: var(--g-ink, var(--ink)); }
  .grade-meta { font-size: 13px; color: var(--ink-muted); font-variant-numeric: tabular-nums; }
  .grade-meta .pt { color: var(--g-ink, var(--accent-ink)); font-weight: 600; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; }
  .card {
    background: var(--surface);
    border-radius: var(--radius);
    box-shadow: 0 1px 3px rgba(60, 45, 30, 0.06), inset 0 0 0 1px var(--line);
    padding: 18px 18px 16px;
    display: flex;
    flex-direction: column;
    gap: 13px;
    transition: box-shadow 200ms ease;
  }
  .card:hover { box-shadow: 0 4px 14px rgba(60, 45, 30, 0.1), inset 0 0 0 1px var(--line-strong); }
  .card-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .name { font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
  .score {
    font-size: 15px;
    font-weight: 600;
    color: var(--accent-ink);
    background: var(--accent-soft);
    padding: 4px 11px;
    border-radius: 999px;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 2px; }
  button {
    font-family: inherit;
    cursor: pointer;
    border: none;
    border-radius: 10px;
    font-weight: 600;
    letter-spacing: -0.01em;
    transition: background 160ms ease, transform 80ms ease, box-shadow 160ms ease;
  }
  button:active { transform: scale(0.97); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .act-btn { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; padding: 9px 12px; font-size: 14px; line-height: 1.15; }
  .act-btn .cnt { font-size: 12px; font-weight: 500; font-variant-numeric: tabular-nums; opacity: 0.8; }
  .act-attend { grid-column: 1 / -1; flex-direction: row; justify-content: space-between; align-items: center; background: var(--attend); color: #fff; font-size: 15px; padding: 11px 14px; }
  .act-attend:hover { background: #256456; }
  .act-attend .cnt { opacity: 0.85; }
  .act-activity { background: var(--activity-soft); color: var(--activity-ink); box-shadow: inset 0 0 0 1px rgba(176, 116, 47, 0.18); }
  .act-activity:hover { background: #f7e2c1; }

  .footer-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    margin-top: 32px;
    padding-top: 20px;
    border-top: 1px solid var(--line);
  }
  .total-note { font-size: 14px; color: var(--ink-muted); font-variant-numeric: tabular-nums; }
  .total-note strong { color: var(--ink); font-weight: 600; }
  .btn-reset { background: transparent; color: var(--ink-muted); font-size: 13px; font-weight: 500; padding: 8px 14px; box-shadow: inset 0 0 0 1px var(--line-strong); }
  .btn-reset:hover { background: #fff; color: #b3402a; box-shadow: inset 0 0 0 1px rgba(179, 64, 42, 0.32); }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(42, 36, 32, 0.45);
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 40px 20px;
    overflow-y: auto;
    z-index: 50;
    animation: fade 160ms ease;
  }
  .modal-overlay[hidden] { display: none; }
  .modal {
    background: var(--surface);
    width: 100%;
    max-width: 680px;
    border-radius: var(--radius);
    box-shadow: 0 20px 50px rgba(42, 36, 32, 0.24), inset 0 0 0 1px var(--line);
    animation: pop 180ms ease;
    overflow: hidden;
  }
  .modal-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 20px 22px 16px; border-bottom: 1px solid var(--line); }
  .modal-head h2 { margin: 0; font-size: 19px; font-weight: 600; letter-spacing: -0.01em; }
  .btn-close { display: inline-flex; align-items: center; justify-content: center; background: transparent; color: var(--ink-muted); padding: 6px; border-radius: 8px; }
  .btn-close:hover { background: var(--bg); color: var(--ink); }

  .modal-toolbar { display: flex; align-items: center; gap: 10px; padding: 16px 22px; font-size: 14px; color: var(--ink-muted); flex-wrap: wrap; }
  .modal-toolbar label { font-weight: 500; }
  .modal-toolbar select {
    font-family: inherit;
    font-size: 14px;
    color: var(--ink);
    padding: 8px 12px;
    border-radius: 9px;
    border: none;
    background: var(--surface);
    box-shadow: inset 0 0 0 1px var(--line-strong);
    cursor: pointer;
    font-variant-numeric: tabular-nums;
    min-width: 0;
  }
  .modal-toolbar select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .modal-toolbar .sel-date { flex: 1; }

  .modal-body { padding: 4px 22px 24px; max-height: 60vh; overflow-y: auto; }
  .hist-table { width: 100%; border-collapse: collapse; font-size: 14px; }
  .hist-table th { text-align: left; font-weight: 500; color: var(--ink-muted); padding: 8px 8px 10px; border-bottom: 1px solid var(--line-strong); white-space: nowrap; }
  .hist-table th.num, .hist-table td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .hist-table td { padding: 11px 8px; border-bottom: 1px solid var(--line); }
  .hist-table tr:last-child td { border-bottom: none; }
  .hist-table .row-name { font-weight: 500; color: var(--ink); }
  .hist-table .row-grade { color: var(--ink-faint); font-size: 13px; white-space: nowrap; }
  .hist-table .row-points { font-weight: 600; color: var(--accent-ink); }
  .hist-table .zero { color: var(--ink-faint); }
  .hist-empty { text-align: center; color: var(--ink-faint); font-size: 14px; padding: 40px 0; line-height: 1.7; }

  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes pop { from { opacity: 0; transform: translateY(8px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
  @keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.18); } 100% { transform: scale(1); } }
  .score.bump { animation: bump 320ms ease; }
  [hidden] { display: none !important; }

  @media (max-width: 480px) {
    .wrap { padding: 24px 16px 48px; }
    .grid { grid-template-columns: 1fr; }
    .grade-grid { grid-template-columns: repeat(2, 1fr); }
    .title-group h1 { font-size: 24px; }
    .header-right { width: 100%; justify-content: space-between; }
    .modal-overlay { padding: 20px 12px; }
    .modal-toolbar .sel-date { flex: 1 1 100%; }
  }
</style>
</head>
<body>
  <div class="backdrop" aria-hidden="true">
    <svg class="sun" viewBox="0 0 200 200" fill="none">
      <circle cx="100" cy="100" r="46" fill="#fbdf9e" />
      <g stroke="#f4cf7e" stroke-width="6" stroke-linecap="round">
        <path d="M100 18v22M100 160v22M18 100h22M160 100h22M42 42l15 15M143 143l15 15M158 42l-15 15M57 143l-15 15" />
      </g>
    </svg>
    <svg class="hills" viewBox="0 0 1440 220" preserveAspectRatio="none" fill="none">
      <path d="M0 150 Q360 90 720 140 T1440 130 V220 H0 Z" fill="#e8f0e6" />
      <path d="M0 178 Q400 130 780 172 T1440 168 V220 H0 Z" fill="#dbe8d8" />
    </svg>
    <svg class="readers" viewBox="0 0 1080 300" preserveAspectRatio="xMidYMax meet" fill="none">
      <ellipse cx="540" cy="286" rx="470" ry="20" fill="#cfe0cc" opacity="0.55" />
      <path d="M300 274 Q540 250 780 274 L810 292 Q540 272 270 292 Z" fill="#f3d9b0" opacity="0.7" />
    </svg>
  </div>

  <div class="wrap">
    <header>
      <div class="brand">
        <span class="brand-mark">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 6.5C10.5 5 8 4.5 4 5v13c4-.5 6.5 0 8 1.5 1.5-1.5 4-2 8-1.5V5c-4-.5-6.5 0-8 1.5Z" />
            <path d="M12 6.5v13" />
          </svg>
        </span>
        <div class="title-group">
          <h1>책 읽어주는 아침</h1>
          <p>학년을 고르고, 이름을 누르면 점수가 쌓여요.</p>
        </div>
      </div>
      <div class="header-right">
        <div class="today" id="today"></div>
        <button class="btn-history" id="openHistory">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="4" width="18" height="18" rx="2" /><path d="M16 2v4M8 2v4M3 10h18" />
          </svg>
          날짜별 기록
        </button>
      </div>
    </header>

    <div class="legend">
      <div><span class="dot attend"></span> 출석 체크 &nbsp;·&nbsp; 1점</div>
      <div><span class="dot activity"></span> 독후감 · 도서대여 · 책 읽어주기 &nbsp;·&nbsp; 각 2점</div>
    </div>

    <section id="screenGrade">
      <div class="stepbar">
        <span class="step-title">학년을 선택하세요</span>
      </div>
      <div class="grade-grid" id="gradeGrid"></div>
    </section>

    <section id="screenStudents" hidden>
      <div class="stepbar">
        <button class="btn-back" id="backBtn">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M15 18l-6-6 6-6" />
          </svg>
          학년 선택
        </button>
        <span class="step-title" id="gradeTitle"></span>
      </div>

      <div class="grid" id="grid"></div>

      <div class="footer-bar">
        <div class="total-note">
          <span id="gradeLabel"></span> 누적 <strong id="totalPoints">0</strong>점
          &nbsp;·&nbsp; 출석 <strong id="totalAttend">0</strong>회
          &nbsp;·&nbsp; 활동 <strong id="totalActivity">0</strong>회
        </div>
        <button class="btn-reset" id="resetBtn">이 학년 기록 초기화</button>
      </div>
    </section>
  </div>

  <div class="modal-overlay" id="historyModal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="historyTitle">
      <div class="modal-head">
        <h2 id="historyTitle">날짜별 누적 기록</h2>
        <button class="btn-close" id="closeHistory" aria-label="닫기">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <path d="M18 6 6 18M6 6l12 12" />
          </svg>
        </button>
      </div>

      <div class="modal-toolbar">
        <label for="dateSelect">날짜</label>
        <select id="dateSelect" class="sel-date"></select>
        <label for="gradeFilter">학년</label>
        <select id="gradeFilter"></select>
      </div>

      <div class="modal-body" id="historyBody"></div>
    </div>
  </div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
  // 실제 발급받으신 Firebase 설정 키 적용
  const firebaseConfig = {
    apiKey: "AIzaSyCKHlF9MrMiRzsBNWlhfghgWib8JUvy7NE",
    authDomain: "morning-readin.firebaseapp.com",
    databaseURL: "https://morning-readin-default-rtdb.firebaseio.com",
    projectId: "morning-readin",
    storageBucket: "morning-readin.firebasestorage.app",
    messagingSenderId: "673161520418",
    appId: "1:673161520418:web:f983f99fb96bc0ea04f17b"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  const dbRef = db.ref("morning_reading_data");

  const ROSTER = {
    "1학년": ["고세정", "김시준", "김아란", "문은지", "이도희", "장유준", "조하민", "허라온"],
    "2학년": ["권민", "김다솜", "조민서", "조민혁", "최서진"],
    "3학년": ["강민호", "고가은", "김지건", "이한빛", "허다온"],
    "4학년": ["강이헌", "김다온", "김수빈", "김희민", "박하민", "이승훈", "이채린", "이한별", "조한솔", "최나림", "최동준"],
    "5학년": ["김시혁", "김채은", "김태우", "박선우", "오광일", "이하온", "천지호", "최재호", "최한별"],
    "6학년": ["김가연", "김서연", "김수지", "김지민", "박은향", "박하준", "오서아", "이규현", "이나래", "이성현", "임혜민", "최동석"],
  };
  const GRADES = Object.keys(ROSTER);

  const GRADE_COLORS = {
    "1학년": { soft: "#fbeede", ink: "#c0562f", line: "rgba(192,86,47,0.18)" },
    "2학년": { soft: "#fbf1d9", ink: "#b0742f", line: "rgba(176,116,47,0.18)" },
    "3학년": { soft: "#e6f2df", ink: "#4a8039", line: "rgba(74,128,57,0.18)" },
    "4학년": { soft: "#daf0ec", ink: "#2f7d6e", line: "rgba(47,125,110,0.18)" },
    "5학년": { soft: "#e0edf7", ink: "#3a6ea3", line: "rgba(58,110,163,0.18)" },
    "6학년": { soft: "#eee6f5", ink: "#7a56a8", line: "rgba(122,86,168,0.18)" },
  };

  const ACTIVITIES = [
    { key: "reading", label: "독후감" },
    { key: "rental", label: "도서대여" },
    { key: "readaloud", label: "책 읽어주기" },
  ];
  const ACTIVITY_KEYS = ACTIVITIES.map((a) => a.key);

  function emptyRec() {
    return { attend: 0, reading: 0, rental: 0, readaloud: 0 };
  }
  function normalizeRec(s) {
    s = s || {};
    const rec = emptyRec();
    rec.attend = Number.isFinite(s.attend) ? s.attend : 0;
    ACTIVITY_KEYS.forEach((k) => { rec[k] = Number.isFinite(s[k]) ? s[k] : 0; });
    return rec;
  }
  function activityCount(rec) {
    return ACTIVITY_KEYS.reduce((sum, k) => sum + rec[k], 0);
  }
  function points(rec) {
    return rec.attend * 1 + activityCount(rec) * 2;
  }

  function keyOf(grade, name) { return grade + "::" + name; }

  function blankTotals() {
    const t = {};
    GRADES.forEach((g) => ROSTER[g].forEach((name) => (t[keyOf(g, name)] = emptyRec())));
    return t;
  }

  function hydrate(saved) {
    const totals = blankTotals();
    if (saved && saved.totals) {
      GRADES.forEach((g) => ROSTER[g].forEach((name) => {
        const k = keyOf(g, name);
        totals[k] = normalizeRec(saved.totals[k]);
      }));
    }
    const byDate = {};
    const savedByDate = saved && saved.byDate && typeof saved.byDate === "object" ? saved.byDate : {};
    Object.keys(savedByDate).forEach((date) => {
      const day = blankTotals();
      GRADES.forEach((g) => ROSTER[g].forEach((name) => {
        const k = keyOf(g, name);
        day[k] = normalizeRec(savedByDate[date][k]);
      }));
      byDate[date] = day;
    });
    return { totals, byDate };
  }

  let data = { totals: blankTotals(), byDate: {} };
  let currentGrade = null;

  // 실시간 온라인 동기화
  dbRef.on("value", (snapshot) => {
    const val = snapshot.val();
    data = hydrate(val);
    if (currentGrade) {
      renderStudents();
    } else {
      renderGradeCards();
    }
    if (!historyModal.hidden) {
      renderHistoryTable();
    }
  });

  function saveData() {
    dbRef.set(data);
  }

  function todayKey() {
    const d = new Date();
    const mm = String(d.getMonth() + 1).padStart(2, "0");
    const dd = String(d.getDate()).padStart(2, "0");
    return d.getFullYear() + "-" + mm + "-" + dd;
  }

  const screenGrade = document.getElementById("screenGrade");
  const screenStudents = document.getElementById("screenStudents");
  const gradeGrid = document.getElementById("gradeGrid");
  const grid = document.getElementById("grid");
  const gradeTitle = document.getElementById("gradeTitle");
  const gradeLabel = document.getElementById("gradeLabel");
  const totalPointsEl = document.getElementById("totalPoints");
  const totalAttendEl = document.getElementById("totalAttend");
  const totalActivityEl = document.getElementById("totalActivity");

  document.getElementById("today").textContent = (() => {
    const n = new Date();
    return n.getFullYear() + "년 " + (n.getMonth() + 1) + "월 " + n.getDate() + "일";
  })();

  function gradePoints(grade) {
    return ROSTER[grade].reduce((sum, name) => sum + points(data.totals[keyOf(grade, name)]), 0);
  }

  function renderGradeCards() {
    gradeGrid.innerHTML = "";
    GRADES.forEach((grade) => {
      const c = GRADE_COLORS[grade];
      const btn = document.createElement("button");
      btn.className = "grade-card";
      btn.dataset.grade = grade;
      btn.style.setProperty("--g-soft", c.soft);
      btn.style.setProperty("--g-ink", c.ink);
      btn.style.setProperty("--g-line", c.line);
      btn.innerHTML = `
        <span class="grade-num">${grade}</span>
        <span class="grade-meta">학생 ${ROSTER[grade].length}명 · 누적 <span class="pt">${gradePoints(grade)}점</span></span>
      `;
      gradeGrid.appendChild(btn);
    });
  }

  gradeGrid.addEventListener("click", (e) => {
    const btn = e.target.closest(".grade-card");
    if (!btn) return;
    openGrade(btn.dataset.grade);
  });

  function buildStudentCards(grade) {
    grid.innerHTML = "";
    ROSTER[grade].forEach((name) => {
      const k = keyOf(grade, name);
      const activityButtons = ACTIVITIES.map((a) =>
        `<button class="act-btn act-activity" data-action="${a.key}" data-key="${k}">
          ${a.label} +2
          <span class="cnt"><b data-count="${k}:${a.key}">0</b>회</span>
        </button>`
      ).join("");

      const card = document.createElement("article");
      card.className = "card";
      card.innerHTML = `
        <div class="card-top">
          <span class="name">${name}</span>
          <span class="score" data-score="${k}">0점</span>
        </div>
        <div class="actions">
          <button class="act-btn act-attend" data-action="attend" data-key="${k}">
            <span>출석 체크 +1</span>
            <span class="cnt"><b data-count="${k}:attend">0</b>회</span>
          </button>
          ${activityButtons}
        </div>
      `;
      grid.appendChild(card);
    });
  }

  function renderStudents(bumpKey) {
    if (!currentGrade) return;
    let totalP = 0;
    let totalA = 0;
    let totalAct = 0;
    ROSTER[currentGrade].forEach((name) => {
      const k = keyOf(currentGrade, name);
      const rec = data.totals[k];
      const p = points(rec);
      totalP += p;
      totalA += rec.attend;
      totalAct += activityCount(rec);

      const scoreEl = grid.querySelector(`[data-score="${k}"]`);
      if (scoreEl) scoreEl.textContent = p + "점";
      const attendCnt = grid.querySelector(`[data-count="${k}:attend"]`);
      if (attendCnt) attendCnt.textContent = rec.attend;

      ACTIVITY_KEYS.forEach((ak) => {
        const actCnt = grid.querySelector(`[data-count="${k}:${ak}"]`);
        if (actCnt) actCnt.textContent = rec[ak];
      });

      if (bumpKey === k && scoreEl) {
        scoreEl.classList.remove("bump");
        void scoreEl.offsetWidth;
        scoreEl.classList.add("bump");
      }
    });
    totalPointsEl.textContent = totalP;
    totalAttendEl.textContent = totalA;
    totalActivityEl.textContent = totalAct;
  }

  function openGrade(grade) {
    currentGrade = grade;
    const c = GRADE_COLORS[grade];
    gradeTitle.innerHTML = `<span class="chip" style="background:${c.ink}"></span>${grade}`;
    gradeLabel.textContent = grade;
    buildStudentCards(grade);
    renderStudents();
    screenGrade.hidden = true;
    screenStudents.hidden = false;
    window.scrollTo(0, 0);
  }

  function backToGrades() {
    currentGrade = null;
    renderGradeCards();
    screenStudents.hidden = true;
    screenGrade.hidden = false;
    window.scrollTo(0, 0);
  }

  document.getElementById("backBtn").addEventListener("click", backToGrades);

  grid.addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-action]");
    if (!btn) return;
    const k = btn.dataset.key;
    const action = btn.dataset.action;
    if (!data.totals[k]) return;

    const date = todayKey();
    if (!data.byDate[date]) data.byDate[date] = blankTotals();

    data.totals[k][action] += 1;
    data.byDate[date][k][action] += 1;

    saveData();
    renderStudents(k);
  });

  document.getElementById("resetBtn").addEventListener("click", () => {
    if (!currentGrade) return;
    if (!confirm(currentGrade + " 학생들의 모든 기록을 초기화할까요?")) return;
    ROSTER[currentGrade].forEach((name) => {
      const k = keyOf(currentGrade, name);
      data.totals[k] = emptyRec();
      Object.keys(data.byDate).forEach((date) => { data.byDate[date][k] = emptyRec(); });
    });
    saveData();
    renderStudents();
  });

  const historyModal = document.getElementById("historyModal");
  const dateSelect = document.getElementById("dateSelect");
  const gradeFilter = document.getElementById("gradeFilter");
  const historyBody = document.getElementById("historyBody");

  function formatDateLabel(key) {
    const p = key.split("-");
    return Number(p[1]) + "월 " + Number(p[2]) + "일";
  }

  function renderHistoryTable() {
    const dateKey = dateSelect.value;
    const gradeSel = gradeFilter.value;
    const day = data.byDate[dateKey];
    if (!day) {
      historyBody.innerHTML = '<div class="hist-empty">이 날짜의 기록이 없어요.</div>';
      return;
    }

    const targetGrades = gradeSel === "전체" ? GRADES : [gradeSel];
    const rows = [];
    targetGrades.forEach((g) => ROSTER[g].forEach((name) => {
      const rec = day[keyOf(g, name)];
      rows.push({ grade: g, name: name, attend: rec.attend, act: activityCount(rec), p: points(rec) });
    }));
    rows.sort((a, b) => b.p - a.p);

    const showGradeCol = gradeSel === "전체";
    const body = rows
      .map((r) => {
        const dim = r.p === 0 ? " zero" : "";
        const gradeCell = showGradeCol ? `<td class="row-grade${dim}">${r.grade}</td>` : "";
        return `<tr>
          <td class="row-name${dim}">${r.name}</td>
          ${gradeCell}
          <td class="num${dim}">${r.attend}</td>
          <td class="num${dim}">${r.act}</td>
          <td class="num row-points${dim}">${r.p}점</td>
        </tr>`;
      })
      .join("");

    const gradeHead = showGradeCol ? "<th>학년</th>" : "";
    historyBody.innerHTML = `
      <table class="hist-table">
        <thead>
          <tr>
            <th>이름</th>${gradeHead}
            <th class="num">출석</th>
            <th class="num">활동</th>
            <th class="num">점수</th>
          </tr>
        </thead>
        <tbody>${body}</tbody>
      </table>
    `;
  }

  function openHistory() {
    const dates = Object.keys(data.byDate).sort().reverse();
    if (dates.length === 0) {
      historyModal.hidden = false;
      dateSelect.innerHTML = "";
      gradeFilter.innerHTML = "";
      historyBody.innerHTML = '<div class="hist-empty">아직 기록된 날짜가 없어요.</div>';
      return;
    }
    dateSelect.innerHTML = dates.map((d) => `<option value="${d}">${formatDateLabel(d)}</option>`).join("");
    gradeFilter.innerHTML = ['<option value="전체">전체 학년</option>']
      .concat(GRADES.map((g) => `<option value="${g}">${g}</option>`)).join("");
    renderHistoryTable();
    historyModal.hidden = false;
  }

  function closeHistory() { historyModal.hidden = true; }

  document.getElementById("openHistory").addEventListener("click", openHistory);
  document.getElementById("closeHistory").addEventListener("click", closeHistory);
  dateSelect.addEventListener("change", renderHistoryTable);
  gradeFilter.addEventListener("change", renderHistoryTable);
  historyModal.addEventListener("click", (e) => { if (e.target === historyModal) closeHistory(); });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && !historyModal.hidden) closeHistory();
  });
</script>
</body>
</html>
